name: Build & Release Desktop Apps (macOS / Windows / Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            artifact_name: ExamSprint-macOS-Universal
          - platform: windows-latest
            args: ""
            artifact_name: ExamSprint-Windows-x64
          - platform: ubuntu-22.04
            args: ""
            artifact_name: ExamSprint-Linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri v2 dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI v2
        run: npm install

      - name: Assemble frontend dist & generate icons
        shell: bash
        run: |
          mkdir -p _dist/js _dist/css _dist/static
          cp index.html manifest.webmanifest _dist/
          cp css/style.css _dist/css/
          cp js/zip-reader.js js/parser.js js/srs-merge.js js/storage.js js/app.js _dist/js/
          cp static/logo.png _dist/static/
          npx tauri icon static/logo.png -o src-tauri/icons

      - name: Build Tauri Desktop Bundles & Upload to Draft Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v3.0.0
          releaseName: "极速刷题宝 ExamSprint Studio v3.0.0"
          releaseBody: |
            ## ⚡ 极速刷题宝 ExamSprint Studio v3.0.0 桌面客户端正式发布

            专注、高颜值、离线优先的智能题库刷题桌面工作台，支持 **Excel (.xlsx) / CSV / Word (.docx) / TXT / JSON** 全格式离线导入、**7 大刷题模式（含斩杀冲刺与 SM-2 艾宾浩斯记忆复习）**、**题库查重体检**、**三套护眼主题** 以及 **GitHub 私有 Gist 多电脑无损云同步**。

            ### 📦 安装包下载选择指南
            - **🍎 macOS（苹果 M1/M2/M3/M4 与 Intel 通用）**：下载 **`.dmg`** 文件双击拖入应用程序（首次打开未签名开源应用若提示无法验证开发者，前往「系统设置 → 隐私与安全性」底部点「仍要打开」，或终端运行 `xattr -cr /Applications/ExamSprintQuiz.app`）。
            - **🪟 Windows 10 / 11 (64位)**：推荐下载 **`_x64-setup.exe`** 或 **`.msi`** 安装包直接运行。
            - **🐧 Linux (Ubuntu / Debian)**：下载 **`.AppImage`**（赋予执行权限即可运行）或 **`.deb`** 安装包。
            - **🌐 在线网页版**：https://atomboyc.github.io/exam-sprint-quiz/
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft Release as Latest Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v3.0.0 --repo ${{ github.repository }} --draft=false --latest
