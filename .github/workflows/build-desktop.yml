name: Build Desktop Apps (macOS / Windows / Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            artifact_name: ExamSprint-macOS-Universal
          - platform: windows-latest
            args: ""
            artifact_name: ExamSprint-Windows-x64
          - platform: ubuntu-22.04
            args: ""
            artifact_name: ExamSprint-Linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js 20 (for Tauri icon generator)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Assemble frontend dist for Tauri
        shell: bash
        run: |
          mkdir -p _dist/js _dist/css _dist/static
          cp index.html manifest.webmanifest _dist/
          cp css/style.css _dist/css/
          cp js/zip-reader.js js/parser.js js/srs-merge.js js/storage.js js/app.js _dist/js/
          cp static/logo.png _dist/static/

      - name: Generate multi-platform Tauri icons
        shell: bash
        run: npx --yes @tauri-apps/cli@^2 icon static/logo.png -o src-tauri/icons

      - name: Build Tauri Native Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "极速刷题宝 v__VERSION__ 桌面客户端"
          releaseBody: "macOS (.dmg) / Windows (.exe, .msi) / Linux (.AppImage, .deb) 原生桌面客户端安装包"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
