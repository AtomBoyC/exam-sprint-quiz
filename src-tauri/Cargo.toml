[package]
name = "exam-sprint-quiz"
version = "3.0.0"
description = "极速刷题宝 · 全平台云同步智能题库桌面客户端"
authors = ["AtomBoyC"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "exam_sprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
